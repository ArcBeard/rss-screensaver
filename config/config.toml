# RSS Screensaver Configuration

[general]
# Layout theme: "newspaper" or "cards"
layout = "newspaper"

# How often to fetch new headlines (seconds)
refresh_interval = 300

# How long each page/card is displayed (seconds)
card_duration = 8

# Maximum number of headlines to keep in rotation
max_headlines = 50

[[feeds]]
name = "Hacker News"
url = "https://hnrss.org/frontpage"

[[feeds]]
name = "Ars Technica"
url = "https://feeds.arstechnica.com/arstechnica/index"

[[feeds]]
name = "Lobsters"
url = "https://lobste.rs/rss"
