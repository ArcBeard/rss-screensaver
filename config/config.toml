# RSS Screensaver Configuration

[general]
# Layout theme: "newspaper" or "cards"
layout = "newspaper"

# How often to fetch new headlines (seconds)
refresh_interval = 300

# How long each page/card is displayed (seconds)
# For newspaper: 120s = ~18min full rotation with 9 headlines per page
card_duration = 120

# Maximum number of headlines to keep in rotation
max_headlines = 50

[processing]
# Post-process articles with Fabric for AI summaries
fabric_enabled = true
# Fabric pattern to use (summarize_micro gives one-sentence summaries)
fabric_pattern = "summarize_micro"
# Model to use for summaries (smaller = less resource usage)
# Overrides fabric's default model; skips if Ollama has a different model loaded
fabric_model = "qwen3:4b"

[[feeds]]
name = "Hacker News"
url = "https://hnrss.org/frontpage"

[[feeds]]
name = "Ars Technica"
url = "https://feeds.arstechnica.com/arstechnica/index"

[[feeds]]
name = "Lobsters"
url = "https://lobste.rs/rss"
