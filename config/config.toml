# RSS Screensaver Configuration

[general]
# Layout theme: "newspaper" or "cards"
layout = "newspaper"

# How often to fetch new headlines (seconds)
refresh_interval = 300

# How long each page/card is displayed (seconds)
# For newspaper: 120s = ~18min full rotation with 9 headlines per page
card_duration = 120

# Maximum number of headlines to keep in rotation
max_headlines = 50

[processing]
# AI summary of each article (one-sentence via Fabric)
fabric_enabled = true
fabric_pattern = "summarize_micro"

# Personal relevance scoring (1-10 based on your interests)
relevance_enabled = true
relevance_pattern = "rate_personal_relevance"

# Model for both summary and relevance (smaller = less resource usage)
# Skips processing if Ollama has a different model loaded
fabric_model = "qwen3:4b"

